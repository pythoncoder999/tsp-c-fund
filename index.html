<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSP Action Checklist</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0A1628;
    --navy-mid: #132040;
    --navy-light: #1E3059;
    --gold: #C9A84C;
    --gold-light: #F0C96A;
    --silver: #A8B8CC;
    --ice: #E8EFF8;
    --white: #F5F8FC;
    --green: #2ECC71;
    --red: #E74C3C;
    --amber: #F39C12;
    --text: #D0DCF0;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  body { background: var(--navy); color: var(--text); font-family: var(--sans); min-height: 100vh; padding: 0; }

  header {
    background: linear-gradient(135deg, var(--navy-mid) 0%, var(--navy-light) 100%);
    border-bottom: 2px solid var(--gold);
    padding: 32px 40px 24px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-row { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; max-width: 1000px; margin: 0 auto; }
  .header-badge { font-family: var(--mono); font-size: 10px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-size: 26px; font-weight: 700; color: var(--white); letter-spacing: -0.5px; }
  h1 span { color: var(--gold); }
  .progress-block { text-align: right; }
  .progress-label { font-family: var(--mono); font-size: 11px; color: var(--silver); margin-bottom: 6px; }
  .progress-bar-wrap { width: 200px; height: 8px; background: var(--navy); border-radius: 4px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); border-radius: 4px; transition: width 0.4s ease; }
  .progress-pct { font-family: var(--mono); font-size: 20px; font-weight: 600; color: var(--gold-light); margin-top: 4px; }

  .ticker-bar { background: var(--navy-mid); border-bottom: 1px solid rgba(201,168,76,0.2); overflow: hidden; padding: 10px 0; }
  .ticker-inner { display: flex; gap: 40px; animation: ticker 22s linear infinite; white-space: nowrap; width: max-content; }
  @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .ticker-item { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; }
  .ticker-fund { color: var(--gold); font-weight: 600; }
  .ticker-price { color: var(--white); }
  .ticker-change.up { color: var(--green); }
  .ticker-change.down { color: var(--red); }
  .ticker-dot { color: var(--silver); }

  main { max-width: 1000px; margin: 0 auto; padding: 32px 24px 60px; }

  .snapshot-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 36px; }
  @media (max-width: 720px) { .snapshot-grid { grid-template-columns: repeat(3, 1fr); } header { padding: 20px; } h1 { font-size: 20px; } }
  @media (max-width: 480px) { .snapshot-grid { grid-template-columns: repeat(2, 1fr); } }

  .fund-card { background: var(--navy-mid); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 14px 12px; text-align: center; position: relative; overflow: hidden; }
  .fund-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .fund-card.g::before { background: #4A9EFF; }
  .fund-card.f::before { background: #A78BFA; }
  .fund-card.c::before { background: #34D399; }
  .fund-card.s::before { background: #F59E0B; }
  .fund-card.i::before { background: #F472B6; }
  .fund-name { font-family: var(--mono); font-size: 18px; font-weight: 600; color: var(--white); }
  .fund-label { font-size: 9px; letter-spacing: 1px; color: var(--silver); text-transform: uppercase; margin: 3px 0 8px; }
  .fund-price { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--white); }
  .fund-chg { font-family: var(--mono); font-size: 11px; margin-top: 4px; }
  .fund-chg.up { color: var(--green); }
  .fund-chg.down { color: var(--red); }

  /* ── CHART ── */
  .chart-wrap { background: var(--navy-mid); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 20px; margin-bottom: 28px; position: relative; }
  .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .chart-title { font-size: 12px; font-family: var(--mono); color: var(--silver); letter-spacing: 1px; text-transform: uppercase; }
  .chart-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .chart-last-updated { font-family: var(--mono); font-size: 10px; color: var(--silver); opacity: 0.7; }

  /* Refresh button */
  .refresh-btn {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    color: var(--navy); background: var(--gold);
    border: none; border-radius: 6px; padding: 6px 12px;
    cursor: pointer; transition: background 0.2s, transform 0.1s;
    letter-spacing: 0.5px; text-transform: uppercase;
    white-space: nowrap;
  }
  .refresh-btn:hover { background: var(--gold-light); }
  .refresh-btn:active { transform: scale(0.97); }
  .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .refresh-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
  .refresh-btn.spinning svg { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Status banner under chart */
  .refresh-status {
    margin-top: 10px; font-family: var(--mono); font-size: 11px;
    padding: 7px 12px; border-radius: 6px; display: none;
    align-items: center; gap: 8px;
  }
  .refresh-status.show { display: flex; }
  .refresh-status.success { background: rgba(46,204,113,0.1); color: #6EEAC3; border: 1px solid rgba(46,204,113,0.2); }
  .refresh-status.error   { background: rgba(231,76,60,0.1);  color: #FF8A80; border: 1px solid rgba(231,76,60,0.2); }
  .refresh-status.loading { background: rgba(201,168,76,0.1); color: var(--gold-light); border: 1px solid rgba(201,168,76,0.2); }

  canvas { width: 100% !important; cursor: crosshair; display: block; }

  #chartTooltip {
    position: absolute; background: #0A1628; border: 1px solid rgba(52,211,153,0.55);
    border-radius: 8px; padding: 9px 13px; pointer-events: none; opacity: 0;
    transition: opacity 0.1s ease; z-index: 20; white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  #chartTooltip.visible { opacity: 1; }
  .tt-date { font-family: var(--mono); font-size: 10px; color: var(--silver); letter-spacing: 0.5px; margin-bottom: 4px; }
  .tt-price { font-family: var(--mono); font-size: 15px; font-weight: 600; color: #34D399; }

  .section { margin-bottom: 28px; }
  .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; cursor: pointer; user-select: none; }
  .section-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .section-icon.blue   { background: rgba(74,158,255,0.15); }
  .section-icon.purple { background: rgba(167,139,250,0.15); }
  .section-icon.green  { background: rgba(52,211,153,0.15); }
  .section-icon.amber  { background: rgba(245,158,11,0.15); }
  .section-icon.pink   { background: rgba(244,114,182,0.15); }
  .section-meta { flex: 1; }
  .section-title { font-size: 15px; font-weight: 600; color: var(--white); }
  .section-sub { font-size: 11px; color: var(--silver); margin-top: 2px; }
  .section-count { font-family: var(--mono); font-size: 11px; color: var(--silver); background: rgba(255,255,255,0.07); padding: 2px 8px; border-radius: 20px; }
  .collapse-arrow { color: var(--silver); font-size: 12px; transition: transform 0.2s; }
  .section.collapsed .collapse-arrow { transform: rotate(-90deg); }
  .section-body { display: flex; flex-direction: column; gap: 8px; overflow: hidden; transition: max-height 0.3s ease, opacity 0.3s; max-height: 2000px; opacity: 1; }
  .section.collapsed .section-body { max-height: 0; opacity: 0; }

  .item { display: flex; align-items: flex-start; gap: 12px; background: var(--navy-mid); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: border-color 0.2s, background 0.2s; position: relative; }
  .item:hover { border-color: rgba(201,168,76,0.3); background: rgba(201,168,76,0.04); }
  .item.checked { background: rgba(46,204,113,0.05); border-color: rgba(46,204,113,0.25); }
  .item.checked .item-title { text-decoration: line-through; color: var(--silver); }
  .checkbox { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.2); border-radius: 5px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; background: transparent; }
  .item.checked .checkbox { background: var(--green); border-color: var(--green); }
  .checkmark { display: none; color: white; font-size: 12px; font-weight: 700; }
  .item.checked .checkmark { display: block; }
  .item-content { flex: 1; min-width: 0; }
  .item-title { font-size: 13.5px; font-weight: 500; color: var(--white); line-height: 1.4; transition: color 0.2s; }
  .item-desc { font-size: 11.5px; color: var(--silver); margin-top: 5px; line-height: 1.5; }
  .item-tag { display: inline-block; font-family: var(--mono); font-size: 9px; letter-spacing: 1px; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; margin-top: 6px; margin-right: 4px; }
  .tag-urgent  { background: rgba(231,76,60,0.2);  color: #FF8A80; }
  .tag-review  { background: rgba(243,156,18,0.2); color: #FFD580; }
  .tag-annual  { background: rgba(74,158,255,0.2); color: #80BDFF; }
  .tag-data    { background: rgba(52,211,153,0.2); color: #6EEAC3; }
  .tag-advance { background: rgba(167,139,250,0.2); color: #C4B5FD; }
  .item-data { font-family: var(--mono); font-size: 11px; color: var(--gold-light); background: rgba(201,168,76,0.1); border-radius: 5px; padding: 5px 9px; margin-top: 7px; display: inline-block; }

  .footer-note { text-align: center; font-size: 11px; color: var(--silver); margin-top: 32px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.07); font-family: var(--mono); }
</style>
</head>
<body>

<div class="ticker-bar">
  <div class="ticker-inner" id="tickerInner"></div>
</div>

<header>
  <div class="header-row">
    <div>
      <div class="header-badge">TSP · Thrift Savings Plan</div>
      <h1>Action <span>Checklist</span></h1>
    </div>
    <div class="progress-block">
      <div class="progress-label">COMPLETION</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="progress-pct" id="progressPct">0%</div>
    </div>
  </div>
</header>

<main>
  <div class="snapshot-grid" id="snapshotGrid"></div>

  <div class="chart-wrap" id="chartWrap">
    <div class="chart-header">
      <div class="chart-title">📈 C Fund · 90-Day Price Trend</div>
      <div class="chart-meta">
        <span class="chart-last-updated" id="lastUpdatedLabel">Last updated: Jun 12, 2026</span>
        <button class="refresh-btn" id="refreshBtn" onclick="fetchLatestPrices()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
          Refresh Prices
        </button>
      </div>
    </div>
    <canvas id="miniChart" height="120"></canvas>
    <div id="chartTooltip">
      <div class="tt-date" id="ttDate"></div>
      <div class="tt-price" id="ttPrice"></div>
    </div>
    <div class="refresh-status" id="refreshStatus"></div>
  </div>

  <div id="checklistRoot"></div>

  <div class="footer-note" id="footerNote">
    Data sourced from TSP share price history · Last updated Jun 12, 2026 · Click items to mark complete
  </div>
</main>

<script>
// ── SEED DATA (fallback / initial) ──
const funds = [
  { id: 'g', name: 'G', label: 'Govt Securities', price: 19.9695,  prev: 19.9670  },
  { id: 'f', name: 'F', label: 'Fixed Income',    price: 20.9801,  prev: 21.0045  },
  { id: 'c', name: 'C', label: 'Common Stock',    price: 119.5288, prev: 118.9254 },
  { id: 's', name: 'S', label: 'Small/Mid Cap',   price: 114.9835, prev: 114.4059 },
  { id: 'i', name: 'I', label: 'International',   price: 64.1908,  prev: 63.6598  },
];

let cTrend = [
  {d:'Mar 19',v:106.93},{d:'Mar 24',v:104.28},{d:'Mar 27',v:103.02},{d:'Apr 1', v:100.41},
  {d:'Apr 4', v:91.80}, {d:'Apr 7', v:88.52}, {d:'Apr 9', v:95.60}, {d:'Apr 14',v:97.12},
  {d:'Apr 17',v:96.38}, {d:'Apr 22',v:99.44}, {d:'Apr 25',v:101.82},{d:'Apr 28',v:103.55},
  {d:'May 1', v:105.10},{d:'May 5', v:107.33},{d:'May 8', v:109.67},{d:'May 12',v:111.20},
  {d:'May 15',v:113.44},{d:'May 19',v:118.17},{d:'May 20',v:119.44},{d:'May 21',v:119.66},
  {d:'May 22',v:120.12},{d:'May 26',v:120.86},{d:'May 27',v:120.88},{d:'May 28',v:121.58},
  {d:'May 29',v:121.85},{d:'Jun 1', v:122.18},{d:'Jun 2', v:122.34},{d:'Jun 3', v:121.44},
  {d:'Jun 4', v:121.95},{d:'Jun 5', v:118.74},{d:'Jun 8', v:119.10},{d:'Jun 9', v:118.80},
  {d:'Jun 10',v:116.88},{d:'Jun 11',v:118.93},{d:'Jun 12',v:119.53}
];

let chartLayout = null;

// ── FETCH LATEST PRICES VIA CLAUDE API (web search) ──
async function fetchLatestPrices() {
  const btn    = document.getElementById('refreshBtn');
  const status = document.getElementById('refreshStatus');

  btn.disabled = true;
  btn.classList.add('spinning');
  setStatus('loading', '⏳ Fetching latest TSP C Fund prices via web search…');

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        system: `You are a financial data assistant. The user wants the latest TSP (Thrift Savings Plan) C Fund share prices for the past 90 days.
Search for "TSP C Fund share price history 2026 site:tsp.gov" or "TSP fund prices June 2026".
Return ONLY a valid JSON object — no markdown, no backticks, no explanation — in this exact format:
{
  "lastDate": "Jun 17, 2026",
  "prices": [
    {"d": "Mar 19", "v": 106.93},
    {"d": "Mar 24", "v": 104.28}
  ],
  "latestPrice": 119.53,
  "prevPrice": 118.93,
  "source": "tsp.gov"
}
Include roughly 30-40 data points spaced across the 90-day window. If you cannot find real data, return exactly: {"error": "no_data"}`,
        messages: [{ role: 'user', content: 'Fetch the latest TSP C Fund 90-day price history as of today June 17 2026. Return only JSON.' }]
      })
    });

    if (!response.ok) throw new Error(`API error ${response.status}`);
    const data = await response.json();

    // Extract text blocks (web_search tool_use response may have multiple blocks)
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');

    // Try to parse JSON from response
    const jsonMatch = textBlocks.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('No JSON found in response');

    const parsed = JSON.parse(jsonMatch[0]);

    if (parsed.error === 'no_data') {
      setStatus('error', '⚠ No live data available — showing most recent cached prices.');
      return;
    }

    // Validate structure
    if (!Array.isArray(parsed.prices) || parsed.prices.length < 5) {
      throw new Error('Invalid price data structure');
    }

    // Update chart data
    cTrend = parsed.prices.map(p => ({ d: p.d, v: parseFloat(p.v) }));

    // Update fund cards if new price available
    if (parsed.latestPrice) {
      const cFund = funds.find(f => f.id === 'c');
      if (cFund) {
        cFund.prev  = parsed.prevPrice || cFund.price;
        cFund.price = parsed.latestPrice;
        document.getElementById('snapshotGrid').innerHTML = '';
        buildSnapshot();
        buildTicker();
      }
    }

    // Redraw chart
    drawChart();

    // Update labels
    const now = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    document.getElementById('lastUpdatedLabel').textContent = `Last updated: ${now}`;
    document.getElementById('footerNote').textContent =
      `Data sourced from ${parsed.source || 'TSP.gov via web search'} · Updated ${now} · Click items to mark complete`;

    const lastPoint = cTrend[cTrend.length - 1];
    setStatus('success', `✓ Chart updated — ${cTrend.length} data points through ${lastPoint.d} · C Fund: $${lastPoint.v.toFixed(4)}`);

  } catch (err) {
    console.error('Refresh error:', err);
    setStatus('error', `✗ Refresh failed: ${err.message}. Showing cached data.`);
  } finally {
    btn.disabled = false;
    btn.classList.remove('spinning');
  }
}

function setStatus(type, msg) {
  const el = document.getElementById('refreshStatus');
  el.className = `refresh-status show ${type}`;
  el.textContent = msg;
  if (type === 'success') {
    setTimeout(() => { el.classList.remove('show'); }, 8000);
  }
}

// ── TICKER ──
function buildTicker() {
  const items = funds.map(f => {
    const chg = f.price - f.prev;
    const pct = chg / f.prev * 100;
    const dir = chg >= 0 ? 'up' : 'down';
    const arrow = chg >= 0 ? '▲' : '▼';
    return `<span class="ticker-item">
      <span class="ticker-fund">${f.name} FUND</span>
      <span class="ticker-price">$${f.price.toFixed(4)}</span>
      <span class="ticker-change ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}%</span>
      <span class="ticker-dot">·</span>
    </span>`;
  });
  const html = items.join('') + items.join('');
  document.getElementById('tickerInner').innerHTML = html;
}

// ── SNAPSHOT ──
function buildSnapshot() {
  const grid = document.getElementById('snapshotGrid');
  funds.forEach(f => {
    const chg = f.price - f.prev;
    const pct = chg / f.prev * 100;
    const dir = chg >= 0 ? 'up' : 'down';
    const arrow = chg >= 0 ? '▲' : '▼';
    grid.innerHTML += `
      <div class="fund-card ${f.id}">
        <div class="fund-name">${f.name}</div>
        <div class="fund-label">${f.label}</div>
        <div class="fund-price">$${f.price.toFixed(4)}</div>
        <div class="fund-chg ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}%</div>
      </div>`;
  });
}

// ── CHART ──
function drawChart(highlightIdx) {
  const canvas = document.getElementById('miniChart');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth - 40;
  const H = 120;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const vals = cTrend.map(d => d.v);
  const mn = Math.min(...vals) - 1;
  const mx = Math.max(...vals) + 1;
  const pad = { l: 50, r: 10, t: 10, b: 28 };
  const cw = W - pad.l - pad.r;
  const ch = H - pad.t - pad.b;

  const toX = i => pad.l + (i / (vals.length - 1)) * cw;
  const toY = v => pad.t + ch - ((v - mn) / (mx - mn)) * ch;
  chartLayout = { pad, cw, ch, mn, mx, W, H, toX, toY };

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  [0, 0.25, 0.5, 0.75, 1].forEach(t => {
    const y = pad.t + ch * t;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
  });

  // Y labels
  ctx.fillStyle = '#A8B8CC';
  ctx.font = '10px IBM Plex Mono, monospace';
  ctx.textAlign = 'right';
  [0, 0.5, 1].forEach(t => {
    const val = mn + (mx - mn) * (1 - t);
    ctx.fillText('$' + val.toFixed(0), pad.l - 6, pad.t + ch * t + 3);
  });

  // Gradient fill
  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + ch);
  grad.addColorStop(0, 'rgba(52,211,153,0.25)');
  grad.addColorStop(1, 'rgba(52,211,153,0)');
  ctx.beginPath();
  vals.forEach((v, i) => { i === 0 ? ctx.moveTo(toX(i), toY(v)) : ctx.lineTo(toX(i), toY(v)); });
  ctx.lineTo(toX(vals.length - 1), pad.t + ch);
  ctx.lineTo(toX(0), pad.t + ch);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  ctx.beginPath();
  vals.forEach((v, i) => { i === 0 ? ctx.moveTo(toX(i), toY(v)) : ctx.lineTo(toX(i), toY(v)); });
  ctx.strokeStyle = '#34D399';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // X labels — adaptive spacing
  ctx.fillStyle = '#A8B8CC';
  ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(vals.length / 8));
  cTrend.forEach((d, i) => {
    if (i % step === 0 || i === cTrend.length - 1) {
      ctx.fillText(d.d, toX(i), H - 5);
    }
  });

  // Dot / hover
  if (highlightIdx === undefined || highlightIdx === null) {
    const lx = toX(vals.length - 1), ly = toY(vals[vals.length - 1]);
    ctx.beginPath(); ctx.arc(lx, ly, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#34D399'; ctx.fill();
  } else {
    const hx = toX(highlightIdx);
    ctx.save();
    ctx.strokeStyle = 'rgba(52,211,153,0.3)'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(hx, pad.t); ctx.lineTo(hx, pad.t + ch); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
    const hy = toY(vals[highlightIdx]);
    ctx.beginPath(); ctx.arc(hx, hy, 8, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(52,211,153,0.18)'; ctx.fill();
    ctx.beginPath(); ctx.arc(hx, hy, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#34D399'; ctx.fill();
  }
}

function setupChartTooltip() {
  const canvas  = document.getElementById('miniChart');
  const tooltip = document.getElementById('chartTooltip');
  const ttDate  = document.getElementById('ttDate');
  const ttPrice = document.getElementById('ttPrice');
  const wrap    = document.getElementById('chartWrap');

  canvas.addEventListener('mousemove', e => {
    if (!chartLayout) return;
    const { pad, cw } = chartLayout;
    const rect   = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    if (mouseX < pad.l || mouseX > pad.l + cw) {
      tooltip.classList.remove('visible'); drawChart(); return;
    }
    const n   = cTrend.length;
    const idx = Math.max(0, Math.min(n - 1, Math.round((mouseX - pad.l) / cw * (n - 1))));
    ttDate.textContent  = cTrend[idx].d + ', 2026';
    ttPrice.textContent = '$' + cTrend[idx].v.toFixed(2);
    drawChart(idx);
    const wrapRect = wrap.getBoundingClientRect();
    const ttW  = tooltip.offsetWidth || 130;
    const ttH  = tooltip.offsetHeight || 52;
    let left   = (e.clientX - wrapRect.left) + 14;
    let top    = (e.clientY - wrapRect.top)  - ttH / 2;
    if (left + ttW > wrap.offsetWidth - 8) left = (e.clientX - wrapRect.left) - ttW - 14;
    if (top < 8) top = 8;
    tooltip.style.left = left + 'px';
    tooltip.style.top  = top  + 'px';
    tooltip.classList.add('visible');
  });
  canvas.addEventListener('mouseleave', () => { tooltip.classList.remove('visible'); drawChart(); });
}

function buildChecklist() {
  const root   = document.getElementById('checklistRoot');
  const stored = JSON.parse(localStorage.getItem('tspChecklist') || '{}');
  sections.forEach(sec => {
    const el = document.createElement('div');
    el.className = 'section';
    el.id = 'sec-' + sec.id;
    const doneInSec = sec.items.filter(it => stored[it.id]).length;
    el.innerHTML = `
      <div class="section-header" onclick="toggleSection('${sec.id}')">
        <div class="section-icon ${sec.iconClass}">${sec.icon}</div>
        <div class="section-meta">
          <div class="section-title">${sec.title}</div>
          <div class="section-sub">${sec.sub}</div>
        </div>
        <span class="section-count" id="count-${sec.id}">${doneInSec}/${sec.items.length}</span>
        <span class="collapse-arrow">▼</span>
      </div>
      <div class="section-body" id="body-${sec.id}">
        ${sec.items.map(it => renderItem(it, stored[it.id])).join('')}
      </div>`;
    root.appendChild(el);
  });
  updateProgress();
}

function renderItem(it, checked) {
  const cls  = checked ? 'item checked' : 'item';
  const tags = (it.tags || []).map(t => `<span class="item-tag tag-${t}">${t}</span>`).join('');
  const data = it.data ? `<div class="item-data">📊 ${it.data}</div>` : '';
  return `
    <div class="${cls}" id="item-${it.id}" onclick="toggleItem('${it.id}')">
      <div class="checkbox"><span class="checkmark">✓</span></div>
      <div class="item-content">
        <div class="item-title">${it.title}</div>
        <div class="item-desc">${it.desc}</div>
        ${tags}${data}
      </div>
    </div>`;
}

function toggleItem(id) {
  const stored = JSON.parse(localStorage.getItem('tspChecklist') || '{}');
  stored[id] = !stored[id];
  localStorage.setItem('tspChecklist', JSON.stringify(stored));
  const el = document.getElementById('item-' + id);
  if (stored[id]) el.classList.add('checked'); else el.classList.remove('checked');
  sections.forEach(sec => {
    if (sec.items.find(it => it.id === id)) {
      const done = sec.items.filter(it => stored[it.id]).length;
      document.getElementById('count-' + sec.id).textContent = `${done}/${sec.items.length}`;
    }
  });
  updateProgress();
}

function toggleSection(id) {
  document.getElementById('sec-' + id).classList.toggle('collapsed');
}

function updateProgress() {
  const stored = JSON.parse(localStorage.getItem('tspChecklist') || '{}');
  const total  = sections.reduce((s, sec) => s + sec.items.length, 0);
  const done   = Object.values(stored).filter(Boolean).length;
  const pct    = Math.round((done / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent  = pct + '%';
}
